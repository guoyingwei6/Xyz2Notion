name: Recover Final Summary Failures

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Reopen a final failure or resume an already-open manual summary"
        required: true
        default: "reopen-final"
        type: choice
        options:
          - reopen-final
          - resume-existing
      batches:
        description: "Sequential batches; each batch handles at most 2 summaries"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
      items_per_batch:
        description: "Canary: 1; bounded bulk: 2"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
      confirmation:
        description: "RECOVER_... for reopen-final; RESUME_... for resume-existing"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xyz2notion-runtime
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install locked application
        run: |
          python -m pip install uv==0.9.28
          uv sync --locked

      - name: Recover bounded final summary batches
        env:
          BATCHES: ${{ inputs.batches }}
          ITEMS_PER_BATCH: ${{ inputs.items_per_batch }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          set -euo pipefail
          action="RECOVER"
          if [[ "$MODE" == "resume-existing" ]]; then action="RESUME"; fi
          expected="${action}_${BATCHES}_BATCHES_OF_${ITEMS_PER_BATCH}_SUMMARIES"
          if [[ ! "$BATCHES" =~ ^[1-6]$ ]] || \
             [[ ! "$ITEMS_PER_BATCH" =~ ^[12]$ ]] || \
             [[ ! "$MODE" =~ ^(reopen-final|resume-existing)$ ]] || \
             [[ "$CONFIRMATION" != "$expected" ]]; then
            printf 'Confirmation error: expected %s.\n' "$expected" >&2
            exit 2
          fi
          config_path="config.yaml"
          if [[ ! -f "$config_path" ]]; then config_path="config.example.yaml"; fi
          batch_timeout="25m"
          if [[ "$ITEMS_PER_BATCH" == "1" ]]; then batch_timeout="15m"; fi
          for ((batch=1; batch<=BATCHES; batch++)); do
            if [[ "$MODE" == "reopen-final" ]]; then
              reopen="$(uv run xyz2notion reopen-summary-failures \
                --limit "$ITEMS_PER_BATCH" \
                --confirm "REOPEN_${ITEMS_PER_BATCH}_SUMMARY_FAILURES")"
              printf 'Batch %s reopen: %s\n' "$batch" "$reopen"
              if [[ "$reopen" =~ reopened=([0-9]+) ]]; then
                reopened_count="${BASH_REMATCH[1]}"
              else
                printf 'Missing bounded recovery count.\n' >&2
                exit 5
              fi
            else
              reopen="Resume existing manual summary requests (limit=${ITEMS_PER_BATCH})"
              reopened_count="$ITEMS_PER_BATCH"
              printf 'Batch %s resume: %s\n' "$batch" "$reopen"
            fi
            if (( reopened_count == 0 )); then
              audit="$(uv run xyz2notion audit-notion-backlog)"
              printf 'Batch %s audit: %s\n' "$batch" "$audit"
              break
            fi
            if (( reopened_count > ITEMS_PER_BATCH )); then
              printf 'Unexpected bounded recovery result.\n' >&2
              exit 5
            fi
            retry_log="$RUNNER_TEMP/final-summary-retry-${batch}.log"
            set +e
            timeout --signal=TERM --kill-after=2m "$batch_timeout" \
              uv run xyz2notion process-manual-retries \
              --config "$config_path" --limit "$ITEMS_PER_BATCH" 2>&1 | tee "$retry_log"
            retry_status="${PIPESTATUS[0]}"
            set -e
            retry="$(<"$retry_log")"
            audit="$(uv run xyz2notion audit-notion-backlog)"
            printf 'Batch %s audit: %s\n' "$batch" "$audit"
            {
              printf '## Final summary recovery batch %s\n\n' "$batch"
              printf '```text\n%s\n%s\n%s\n```\n' "$reopen" "$retry" "$audit"
            } >> "$GITHUB_STEP_SUMMARY"
            if (( retry_status != 0 )); then
              exit "$retry_status"
            fi
          done
