name: Xyz2Notion Notion-only Repair

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Bounded Notion-only operation
        required: true
        type: choice
        options:
          - repair-covers
          - reconcile-published-ai
      limit:
        description: "Cover: 1-10; published AI: 1-2"
        required: true
        default: "2"
        type: string
      confirmation:
        description: Exact CLI confirmation phrase
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xyz2notion-runtime
  cancel-in-progress: false

jobs:
  notion-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install locked application
        run: |
          python -m pip install uv==0.9.28
          uv sync --locked

      - name: Run bounded Notion-only operation
        env:
          OPERATION: ${{ inputs.operation }}
          LIMIT: ${{ inputs.limit }}
          CONFIRMATION: ${{ inputs.confirmation }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            repair-covers)
              result="$(uv run xyz2notion repair-notion-covers \
                --limit "$LIMIT" --confirm "$CONFIRMATION")"
              ;;
            reconcile-published-ai)
              result="$(uv run xyz2notion reconcile-published-ai \
                --limit "$LIMIT" --confirm "$CONFIRMATION")"
              ;;
            *)
              printf 'Unsupported Notion-only operation.\n' >&2
              exit 2
              ;;
          esac
          printf '%s\n' "$result"
          {
            printf '## Xyz2Notion Notion-only repair\n\n'
            printf 'Operation: `%s`\n\n' "$OPERATION"
            printf '```text\n%s\n```\n' "$result"
          } >> "$GITHUB_STEP_SUMMARY"
