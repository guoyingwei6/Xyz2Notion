name: Sync Podcast Metadata

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xyz2notion-metadata
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install locked application
        run: |
          python -m pip install uv==0.9.28
          uv sync --locked

      - name: Sync metadata and statistics
        env:
          XIAOYUZHOU_REFRESH_TOKEN: ${{ secrets.XIAOYUZHOU_REFRESH_TOKEN }}
          XIAOYUZHOU_DEVICE_ID: ${{ vars.XIAOYUZHOU_DEVICE_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          set -euo pipefail
          result="$(uv run xyz2notion sync-metadata)"
          printf '%s\n' "$result"
          {
            printf '## Xyz2Notion metadata sync\n\n'
            printf '```text\n%s\n```\n' "$result"
          } >> "$GITHUB_STEP_SUMMARY"
