name: Sync Podcast Metadata

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_SAFE_INCREMENTAL_SYNC"
        required: true
        type: string
  schedule:
    # 05:17 Asia/Taipei / Asia/Shanghai. Avoid the busy top of the hour.
    - cron: "17 21 * * *"

permissions:
  contents: read

concurrency:
  group: xyz2notion-runtime
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit safety confirmation
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && \
                "$CONFIRMATION" != "RUN_SAFE_INCREMENTAL_SYNC" ]]; then
            printf 'Refusing to access Xiaoyuzhou without the exact confirmation.\n' >&2
            exit 2
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" && "$EVENT_NAME" != "schedule" ]]; then
            printf 'Refusing unsupported metadata trigger.\n' >&2
            exit 2
          fi

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install locked application
        run: |
          python -m pip install uv==0.9.28
          uv sync --locked

      - name: Sync metadata and statistics
        env:
          XIAOYUZHOU_REFRESH_TOKEN: ${{ secrets.XIAOYUZHOU_REFRESH_TOKEN }}
          XIAOYUZHOU_DEVICE_ID: ${{ vars.XIAOYUZHOU_DEVICE_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          set -euo pipefail
          result="$(uv run xyz2notion sync-metadata)"
          printf '%s\n' "$result"
          {
            printf '## Xyz2Notion metadata sync\n\n'
            printf '```text\n%s\n```\n' "$result"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Localize new podcast covers
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: |
          set -euo pipefail
          result="$(uv run xyz2notion repair-notion-covers \
            --limit 10 --confirm REPAIR_10_NOTION_COVERS)"
          printf '%s\n' "$result"
          {
            printf '\n## Xyz2Notion automatic cover localization\n\n'
            printf '```text\n%s\n```\n' "$result"
          } >> "$GITHUB_STEP_SUMMARY"
