name: Enrich Transcribed Episodes

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "backlog: at most 2; normal: at most 1"
        required: true
        default: "backlog"
        type: choice
        options:
          - backlog
          - normal
      limit:
        description: "Requested bound; the selected mode applies its stricter cap"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
  schedule:
    - cron: "41 */2 * * *"
  # Normal lane: start only after the ASR workflow completes successfully.
  workflow_run:
    workflows: ["Transcribe Episode Queue"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: xyz2notion-runtime
  cancel-in-progress: false

jobs:
  enrich:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        vars.XYZ2NOTION_ENRICHMENT_QUEUE_ENABLED == 'true' &&
        (
          (github.event_name == 'schedule' &&
           github.event.schedule == '41 */2 * * *' &&
           vars.XYZ2NOTION_ENRICHMENT_BACKLOG == 'true') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           vars.XYZ2NOTION_ENRICHMENT_BACKLOG != 'true')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Cache local summary runtime and model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/xyz2notion
          key: local-summary-${{ runner.os }}-py312-qwen3-1.7b-q4km-${{ hashFiles('uv.lock') }}
          restore-keys: |
            local-summary-${{ runner.os }}-py312-qwen3-1.7b-q4km-

      - name: Install locked application and cached local summary runtime
        run: |
          python -m pip install uv==0.9.28
          uv sync --locked
          runtime_dir="$HOME/.cache/xyz2notion/runtime"
          runtime_wheel="$runtime_dir/llama_cpp_python-0.3.19-cp312-cp312-linux_x86_64.whl"
          mkdir -p "$runtime_dir"
          if [[ ! -f "$runtime_wheel" ]] || \
             ! printf '%s  %s\n' \
               'ca1b372a3f5b30dcd0a73179a33b0f675adbb805bc64f6f656f208a71ff631d4' \
               "$runtime_wheel" | sha256sum --check --status; then
            curl --fail --location --retry 3 --output "$runtime_wheel.part" \
              'https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.19/llama_cpp_python-0.3.19-cp312-cp312-linux_x86_64.whl'
            printf '%s  %s\n' \
              'ca1b372a3f5b30dcd0a73179a33b0f675adbb805bc64f6f656f208a71ff631d4' \
              "$runtime_wheel.part" | sha256sum --check --status
            mv "$runtime_wheel.part" "$runtime_wheel"
          fi
          uv pip install --python .venv/bin/python "$runtime_wheel"

      - name: Enrich persisted transcripts only
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_LIMIT: ${{ inputs.limit }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          set -euo pipefail
          config_path="config.yaml"
          if [[ ! -f "$config_path" ]]; then config_path="config.example.yaml"; fi
          mode="normal"
          limit="1"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${MANUAL_MODE:-backlog}"
            limit="${MANUAL_LIMIT:-2}"
          elif [[ "$SCHEDULE" == "41 */2 * * *" ]]; then
            mode="backlog"
            limit="2"
          fi
          result="$(
            uv run python -m xyz2notion.orchestration.enrichment_queue \
              --config "$config_path" \
              --mode "$mode" \
              --limit "$limit"
          )"
          printf '%s\n' "$result"
          {
            printf '## Xyz2Notion transcript enrichment\n\n'
            printf '```text\n%s\n```\n' "$result"
          } >> "$GITHUB_STEP_SUMMARY"
