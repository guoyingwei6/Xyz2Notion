name: Enrich Transcribed Episodes

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "backlog: at most 2; normal: at most 2"
        required: true
        default: "backlog"
        type: choice
        options:
          - backlog
          - normal
      limit:
        description: "Requested bound; the selected mode applies its stricter cap"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
      preflight_only:
        description: "Test the shared summary route without changing Notion"
        required: true
        default: false
        type: boolean
      diagnose_siliconflow:
        description: "Probe SiliconFlow model and request features without changing Notion"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "41 */2 * * *"
  # Normal lane: start after ASR, with a periodic fallback for persisted transcripts
  # that were left behind when the preceding ASR run consumed its bound.
  workflow_run:
    workflows: ["Transcribe Episode Queue"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: xyz2notion-runtime
  cancel-in-progress: false

jobs:
  enrich:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        vars.XYZ2NOTION_ENRICHMENT_QUEUE_ENABLED == 'true' &&
        (
          (github.event_name == 'schedule' &&
           github.event.schedule == '41 */2 * * *') ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install locked application
        run: |
          python -m pip install uv==0.9.28
          uv sync --locked

      - name: Enrich persisted transcripts only
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          BACKLOG_ENABLED: ${{ vars.XYZ2NOTION_ENRICHMENT_BACKLOG }}
          MANUAL_MODE: ${{ inputs.mode }}
          MANUAL_LIMIT: ${{ inputs.limit }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
          DIAGNOSE_SILICONFLOW: ${{ inputs.diagnose_siliconflow }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          set -euo pipefail
          config_path="config.yaml"
          if [[ ! -f "$config_path" ]]; then config_path="config.example.yaml"; fi
          mode="normal"
          limit="2"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${MANUAL_MODE:-backlog}"
            limit="${MANUAL_LIMIT:-2}"
          elif [[ "$SCHEDULE" == "41 */2 * * *" && "$BACKLOG_ENABLED" == "true" ]]; then
            mode="backlog"
            limit="2"
          elif [[ "$EVENT_NAME" == "workflow_run" && "$BACKLOG_ENABLED" == "true" ]]; then
            mode="backlog"
            limit="2"
          fi
          queue_cmd=(
            uv run python -m xyz2notion.orchestration.enrichment_queue
            --config "$config_path"
            --mode "$mode"
            --limit "$limit"
          )
          if [[ "${PREFLIGHT_ONLY:-false}" == "true" ]]; then
            queue_cmd+=(--preflight-only)
          fi
          if [[ "${DIAGNOSE_SILICONFLOW:-false}" == "true" ]]; then
            queue_cmd=(uv run python -m xyz2notion.orchestration.summary_diagnostic)
          fi
          set +e
          result="$("${queue_cmd[@]}" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$result"
          {
            printf '## Xyz2Notion transcript enrichment\n\n'
            printf '```text\n%s\n```\n' "$result"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
