name: Check Tingwu Authentication

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "read-only auth check or one visible test record"
        required: true
        default: "auth"
        type: choice
        options:
          - auth
          - visible-smoke
      confirmation:
        description: "Required only for visible-smoke: CREATE_TINGWU_VISIBLE_SMOKE"
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install locked application
        run: |
          python -m pip install uv==0.9.28
          uv sync --locked

      - name: Check Tingwu Cookie or visible record creation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
          TINGWU_COOKIE: ${{ secrets.TINGWU_COOKIE }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "visible-smoke" ]]; then
            uv run xyz2notion tingwu-visible-smoke \
              --confirm "$CONFIRMATION" \
              --poll-attempts 3 \
              --visible-attempts 3
          else
            uv run xyz2notion tingwu-check
          fi
