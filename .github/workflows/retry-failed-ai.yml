name: Retry Failed Episode AI

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum failed items per stage"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
  schedule:
    # Retry only persisted `可重试失败` checkpoints; never select normal work.
    - cron: "53 */2 * * *"

permissions:
  contents: read

concurrency:
  group: xyz2notion-runtime
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      vars.ASR_QUEUE_ENABLED == 'true' ||
      vars.XYZ2NOTION_ENRICHMENT_QUEUE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Cache AI dependencies and local fallback models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/huggingface
            ~/.cache/xyz2notion
          key: retry-ai-${{ runner.os }}-py312-${{ hashFiles('uv.lock') }}
          restore-keys: |
            retry-ai-${{ runner.os }}-py312-

      - name: Install FFmpeg, locked application, and cached summary runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install uv==0.9.28
          uv sync --locked
          runtime_dir="$HOME/.cache/xyz2notion/runtime"
          runtime_wheel="$runtime_dir/llama_cpp_python-0.3.19-cp312-cp312-linux_x86_64.whl"
          mkdir -p "$runtime_dir"
          if [[ ! -f "$runtime_wheel" ]] || \
             ! printf '%s  %s\n' \
               'ca1b372a3f5b30dcd0a73179a33b0f675adbb805bc64f6f656f208a71ff631d4' \
               "$runtime_wheel" | sha256sum --check --status; then
            curl --fail --location --retry 3 --output "$runtime_wheel.part" \
              'https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.19/llama_cpp_python-0.3.19-cp312-cp312-linux_x86_64.whl'
            printf '%s  %s\n' \
              'ca1b372a3f5b30dcd0a73179a33b0f675adbb805bc64f6f656f208a71ff631d4' \
              "$runtime_wheel.part" | sha256sum --check --status
            mv "$runtime_wheel.part" "$runtime_wheel"
          fi
          uv pip install --python .venv/bin/python "$runtime_wheel"

      - name: Process manually requested retries first
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          RETRY_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          config_path="config.yaml"
          if [[ ! -f "$config_path" ]]; then config_path="config.example.yaml"; fi
          set +e
          result="$(uv run xyz2notion process-manual-retries \
            --config "$config_path" --limit "${RETRY_LIMIT:-2}" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$result"
          {
            printf '## Xyz2Notion manually requested retries\n\n'
            printf '```text\n%s\n```\n' "$result"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Retry failed ASR checkpoints only
        if: github.event_name == 'workflow_dispatch' || vars.ASR_QUEUE_ENABLED == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          RETRY_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          config_path="config.yaml"
          if [[ ! -f "$config_path" ]]; then config_path="config.example.yaml"; fi
          result="$(uv run xyz2notion process-asr \
            --config "$config_path" --mode retry --limit "${RETRY_LIMIT:-2}")"
          printf '%s\n' "$result"
          {
            printf '## Xyz2Notion failed ASR retry\n\n'
            printf '```text\n%s\n```\n' "$result"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retry failed enrichment checkpoints only
        if: >-
          github.event_name == 'workflow_dispatch' ||
          vars.XYZ2NOTION_ENRICHMENT_QUEUE_ENABLED == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          RETRY_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          config_path="config.yaml"
          if [[ ! -f "$config_path" ]]; then config_path="config.example.yaml"; fi
          set +e
          result="$(uv run python -m xyz2notion.orchestration.enrichment_queue \
            --config "$config_path" --mode retry --limit "${RETRY_LIMIT:-2}" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$result"
          {
            printf '## Xyz2Notion failed enrichment retry\n\n'
            printf '```text\n%s\n```\n' "$result"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
