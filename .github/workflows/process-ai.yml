name: Process Episode AI

on:
  schedule:
    - cron: "43 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xyz2notion-ai
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install locked application
        run: |
          python -m pip install uv==0.9.28
          uv sync --locked

      - name: Advance Episode AI state
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          TINGWU_COOKIE: ${{ secrets.TINGWU_COOKIE }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: |
          set -euo pipefail
          config_path="config.yaml"
          if [[ ! -f "$config_path" ]]; then config_path="config.example.yaml"; fi
          result="$(uv run xyz2notion process-ai --config "$config_path")"
          printf '%s\n' "$result"
          {
            printf '## Xyz2Notion Episode AI\n\n'
            printf '```text\n%s\n```\n' "$result"
          } >> "$GITHUB_STEP_SUMMARY"
