name: Process Episode AI

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum Episode candidates for this manual validation run"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
      only_in_flight:
        description: "Advance only an existing queued/transcribing Episode"
        required: true
        default: false
        type: boolean
      only_transcribed:
        description: "Advance only an Episode with a persisted transcript"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "23 */2 * * *"

permissions:
  contents: read

concurrency:
  group: xyz2notion-runtime
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Cache local summary runtime and model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/uv
            ~/.cache/xyz2notion
          key: local-summary-${{ runner.os }}-py312-qwen3-1.7b-q4km-${{ hashFiles('uv.lock') }}
          restore-keys: |
            local-summary-${{ runner.os }}-py312-qwen3-1.7b-q4km-

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install locked application
        run: |
          python -m pip install uv==0.9.28
          uv sync --locked
          runtime_dir="$HOME/.cache/xyz2notion/runtime"
          runtime_wheel="$runtime_dir/llama_cpp_python-0.3.19-cp312-cp312-linux_x86_64.whl"
          mkdir -p "$runtime_dir"
          if [[ ! -f "$runtime_wheel" ]] || \
             ! printf '%s  %s\n' \
               'ca1b372a3f5b30dcd0a73179a33b0f675adbb805bc64f6f656f208a71ff631d4' \
               "$runtime_wheel" | sha256sum --check --status; then
            curl --fail --location --retry 3 --output "$runtime_wheel.part" \
              'https://github.com/abetlen/llama-cpp-python/releases/download/v0.3.19/llama_cpp_python-0.3.19-cp312-cp312-linux_x86_64.whl'
            printf '%s  %s\n' \
              'ca1b372a3f5b30dcd0a73179a33b0f675adbb805bc64f6f656f208a71ff631d4' \
              "$runtime_wheel.part" | sha256sum --check --status
            mv "$runtime_wheel.part" "$runtime_wheel"
          fi
          uv pip install --python .venv/bin/python "$runtime_wheel"

      - name: Advance Episode AI state
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_LIMIT: ${{ inputs.limit }}
          ONLY_IN_FLIGHT: ${{ inputs.only_in_flight }}
          ONLY_TRANSCRIBED: ${{ inputs.only_transcribed }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          TINGWU_COOKIE: ${{ secrets.TINGWU_COOKIE }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: |
          set -euo pipefail
          config_path="config.yaml"
          if [[ ! -f "$config_path" ]]; then config_path="config.example.yaml"; fi
          args=(process-ai --config "$config_path")
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            args+=(--limit "${MANUAL_LIMIT:-1}")
            if [[ "$ONLY_IN_FLIGHT" == "true" ]]; then
              args+=(--only-in-flight)
            fi
            if [[ "$ONLY_TRANSCRIBED" == "true" ]]; then
              args+=(--only-transcribed)
            fi
          fi
          result="$(uv run xyz2notion "${args[@]}")"
          printf '%s\n' "$result"
          {
            printf '## Xyz2Notion Episode AI\n\n'
            printf '```text\n%s\n```\n' "$result"
          } >> "$GITHUB_STEP_SUMMARY"
