name: Initialize Notion

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to run"
        required: true
        default: initialize
        type: choice
        options:
          - initialize
          - audit-dashboard
          - cleanup-dashboard-layout
          - rebuild-dashboard
      confirmation:
        description: "Exact confirmation required for destructive operations"
        required: false
        type: string
      expected_count:
        description: "Exact positive linked block or duplicate bundle count"
        required: false
        type: string
      expected_total:
        description: "For layout cleanup: exact root block count before cleanup"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: xyz2notion-runtime
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install locked application
        run: |
          python -m pip install uv==0.9.28
          uv sync --locked

      - name: Initialize or rebuild dashboard views
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
          EXPECTED_TOTAL: ${{ inputs.expected_total }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == "initialize" ]]; then
            result="$(uv run xyz2notion notion-init)"
          elif [[ "$OPERATION" == "audit-dashboard" ]]; then
            result="$(uv run xyz2notion audit-dashboard)"
          elif [[ "$OPERATION" == "cleanup-dashboard-layout" ]]; then
            if [[ ! "$EXPECTED_COUNT" =~ ^[1-9][0-9]*$ ]] || \
               [[ ! "$EXPECTED_TOTAL" =~ ^[1-9][0-9]*$ ]]; then
              printf 'Dashboard layout cleanup refused: expected counts must be positive\n' >&2
              exit 2
            fi
            expected_blocks="$((EXPECTED_COUNT * 6))"
            expected_confirmation="ARCHIVE_${EXPECTED_COUNT}_BUNDLES_${expected_blocks}_LAYOUT_BLOCKS"
            if [[ "$CONFIRMATION" != "$expected_confirmation" ]]; then
              printf 'Dashboard layout cleanup refused: confirmation did not match counts\n' >&2
              exit 2
            fi
            result="$(uv run xyz2notion cleanup-dashboard-layout \
              --confirm "$CONFIRMATION" \
              --expected-bundles "$EXPECTED_COUNT" \
              --expected-total "$EXPECTED_TOTAL")"
          elif [[ "$OPERATION" == "rebuild-dashboard" ]]; then
            if [[ ! "$EXPECTED_COUNT" =~ ^[1-9][0-9]*$ ]]; then
              printf 'Dashboard rebuild refused: expected_count must be positive\n' >&2
              exit 2
            fi
            if [[ "$CONFIRMATION" != "ARCHIVE_${EXPECTED_COUNT}_LINKED_DATABASE_BLOCKS" ]]; then
              printf 'Dashboard rebuild refused: confirmation did not match count\n' >&2
              exit 2
            fi
            result="$(uv run xyz2notion rebuild-dashboard \
              --confirm "$CONFIRMATION" \
              --expected-count "$EXPECTED_COUNT")"
          else
            printf 'Unsupported initialization operation\n' >&2
            exit 2
          fi
          printf '%s\n' "$result"
          {
            printf '## Xyz2Notion operation: %s\n\n' "$OPERATION"
            printf '```text\n%s\n```\n' "$result"
          } >> "$GITHUB_STEP_SUMMARY"
