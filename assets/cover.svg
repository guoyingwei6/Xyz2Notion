<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
  <title id="title">Xyz2Notion podcast dashboard cover</title>
  <desc id="desc">Original purple and blue abstract audio waveform cover.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17152d"/>
      <stop offset="0.52" stop-color="#44318d"/>
      <stop offset="1" stop-color="#176b87"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1500" height="600" fill="url(#background)"/>
  <circle cx="1250" cy="80" r="260" fill="#7c3aed" opacity=".18"/>
  <circle cx="180" cy="560" r="330" fill="#0891b2" opacity=".16"/>
  <g fill="url(#wave)" opacity=".9" filter="url(#glow)">
    <rect x="150" y="265" width="18" height="70" rx="9"/>
    <rect x="190" y="220" width="18" height="160" rx="9"/>
    <rect x="230" y="155" width="18" height="290" rx="9"/>
    <rect x="270" y="195" width="18" height="210" rx="9"/>
    <rect x="310" y="245" width="18" height="110" rx="9"/>
    <rect x="350" y="175" width="18" height="250" rx="9"/>
    <rect x="390" y="130" width="18" height="340" rx="9"/>
    <rect x="430" y="205" width="18" height="190" rx="9"/>
    <rect x="470" y="260" width="18" height="80" rx="9"/>
  </g>
  <text x="570" y="285" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="84" font-weight="700" letter-spacing="-2">Xyz2Notion</text>
  <text x="575" y="355" fill="#dbeafe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" letter-spacing="3">PODCAST KNOWLEDGE DASHBOARD</text>
</svg>
