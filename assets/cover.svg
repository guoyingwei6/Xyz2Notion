<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" role="img" aria-labelledby="title desc">
  <title id="title">Xyz2Notion podcast dashboard cover</title>
  <desc id="desc">An original warm desk scene with coffee, headphones, and an audio waveform.</desc>
  <defs>
