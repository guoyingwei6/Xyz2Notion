schema_version: 1

asr:
  provider_order:
    - dashscope
  # Candidates only: each model also needs explicit free-only confirmation below.
  dashscope_model: paraformer-v2
  dashscope_fallback_models:
    - fun-asr
    - fun-asr-mtl
    - qwen-audio-3.0-asr-flash-filetrans
    - qwen3-asr-flash-filetrans
    - paraformer-v1
    - paraformer-mtl-v1
  # First enable "free quota exhausted -> stop" for each model in Alibaba's console.
  # Then list ONLY those confirmed model names here. Empty means no new ASR.
  # This attestation cannot read quota balances or change account billing settings.
  dashscope_free_tier_confirmed_models: []
  siliconflow_models:
    - FunAudioLLM/SenseVoiceSmall
    - TeleAI/TeleSpeechASR
  local_whisper_model: small

summary:
  enabled: true
  # SiliconFlow free model -> local Qwen. No DashScope summary fallback.
  siliconflow_models:
    - Qwen/Qwen3-8B
  # Requires: uv sync --locked --extra local-summary
  local_qwen_fallback: true
  prompt_version: summary-v1
  chunk_tokens: 12000
  chunk_minutes: 60
  max_output_tokens: 4096

limits:
  episodes_per_run: 4
  asr_minutes_per_day: 240
  asr_minutes_per_month: 3000
  provider_poll_attempts: 60

state_file: .xyz2notion/state.json
