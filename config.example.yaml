schema_version: 1

asr:
  provider_order:
    - tingwu_cookie
    - siliconflow
    - local_whisper
  siliconflow_models:
    - FunAudioLLM/SenseVoiceSmall
    - TeleAI/TeleSpeechASR
  local_whisper_model: small

summary:
  enabled: true
  siliconflow_models:
    - Qwen/Qwen3-8B
    - Qwen/Qwen2.5-7B-Instruct
  prompt_version: summary-v1
  chunk_tokens: 24000
  chunk_minutes: 30
  max_output_tokens: 8192

limits:
  episodes_per_run: 2
  asr_minutes_per_day: 240
  asr_minutes_per_month: 3000
  provider_poll_attempts: 60

state_file: .xyz2notion/state.json
