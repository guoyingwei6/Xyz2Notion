schema_version: 1

asr:
  provider_order:
    - dashscope
    - siliconflow
    - local_whisper
  # DashScope's internal model fallback order.  The API key is the same for
  # all three; the account console decides which model still has free quota.
  dashscope_model: paraformer-v1
  dashscope_fallback_models:
    - paraformer-v2
    - paraformer-mtl-v1
  siliconflow_models:
    - FunAudioLLM/SenseVoiceSmall
    - TeleAI/TeleSpeechASR
  local_whisper_model: small

summary:
  enabled: true
  siliconflow_models:
    - Qwen/Qwen3-8B
  local_qwen_fallback: true
  prompt_version: summary-v1
  chunk_tokens: 17000
  chunk_minutes: 60
  max_output_tokens: 4096

limits:
  episodes_per_run: 4
  asr_minutes_per_day: 240
  asr_minutes_per_month: 3000
  provider_poll_attempts: 60

state_file: .xyz2notion/state.json
