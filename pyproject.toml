[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyz2notion"
version = "0.2.0"
description = "Self-hosted Xiaoyuzhou podcast sync and enrichment for Notion"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [
  { name = "Xyz2Notion contributors" },
]
keywords = ["xiaoyuzhou", "notion", "podcast", "transcription"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "faster-whisper==1.2.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
]

[project.scripts]
xyz2notion = "xyz2notion.cli:main"

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
  "types-pyyaml==6.0.12.20260724",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/xyz2notion/enrichment/prompts.py" = ["RUF001"]
"src/xyz2notion/enrichment/text.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["xyz2notion"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
